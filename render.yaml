services:
  - type: web
    name: geosat-intelligence-api
    runtime: docker
    plan: free
    rootDir: "geo_sat project"
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: B2_ENDPOINT_URL
        value: https://s3.us-east-005.backblazeb2.com
      - key: B2_REGION
        value: us-east-005
      - key: B2_BUCKET_NAME
        value: geosat-assets
      - key: B2_ACCESS_KEY_ID
        sync: false
      - key: B2_SECRET_ACCESS_KEY
        sync: false
