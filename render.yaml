services:
  - type: web
    name: geosat-intelligence-api
    runtime: docker
    plan: free
    rootDir: "geo_sat project"
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      - key: ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
